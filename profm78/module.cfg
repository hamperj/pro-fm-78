# PRO-FM-78: Melodee's Prophet engine (keremimo/melodee 165d177, 1.6.1) with Sequential's 200 factory programs
# (profm78/take.py)
name = PRO-FM-78
version = 1
# the FPU, as Melodee builds the engine (its single-precision floats in the general registers: nothing more to save in
# the audio interrupt)
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off -Werror=double-promotion
